[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dothesis-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "python-multipart>=0.0.12",
  "bcrypt>=4.2",
  "itsdangerous>=2.2",
  "PyJWT>=2.9",
  "boto3>=1.35",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "email-validator>=2.2",
  "markdown>=3.7",
  "polar-sdk>=0.9",
  "google-auth>=2.34",
  "langchain>=1.3.0,<2",
  "langchain-core>=1.4.0,<2",
  "langgraph>=1.2.0,<2",
  "langgraph-checkpoint>=4.1.0,<5",
  "langgraph-checkpoint-postgres>=3.1.0,<4",
  "langchain-google-genai>=4.1.0,<5",
  "pdfminer.six>=20231228",
  "posthog>=3.0",
  # F13: deterministic results-export parsing. lxml backs pandas.read_html for the
  # HTML export path; openpyxl backs the .xlsx path in agent/tools/output_parse.py.
  "lxml>=5.0",
  "openpyxl>=3.1",
  # OpenAI-compatible client for the Ofox / OpenRouter gateway routes (F10 + Ofox).
  # Needed at runtime whenever DOTHESIS_MODEL_ROUTE / ORCHESTRATOR_LLM_ROUTE=ofox.
  "langchain-openai>=1.3,<2",
  # NOT declarable here, but required at runtime: the sibling editable distributions
  # `dothesis-quality` (app/pricing.py -> quality.model_prices, at module load — so
  # the API will not boot without it), `dothesis-orchestrator` (routers/m5_editor.py),
  # and `dothesis-agent` (routers/chat_v3.py). They are local path distributions with
  # no PyPI name — listing them here makes `pip install -e api` fail to resolve, and
  # `agent/pyproject.toml` likewise imports quality.rubric without declaring it. The
  # repo wires them via `pip install -e {orchestrator,agent,quality}` in dev.sh; a new
  # deploy path must run those three installs or the api dies at import.
  #
  # This is deliberately NOT the pdfminer.six precedent (2e51fca): that was a THIRD-
  # PARTY PyPI dep that had to follow code across a package boundary, and it is
  # declarable. A local sibling distribution is a different category.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "moto[s3]>=5.0",
  "ruff>=0.7",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
