[project]
name = "opendraft-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "python-multipart>=0.0.12",
  "bcrypt>=4.2",
  "itsdangerous>=2.2",
  "boto3>=1.35",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "email-validator>=2.2",
  "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.8",
  "moto[s3]>=5.0",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
