[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dothesis-orchestrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # LangChain 1.x stack (verified May 2026 PyPI versions)
  "langchain>=1.3.0,<2",
  "langchain-core>=1.4.0,<2",
  "langgraph>=1.2.0,<2",
  "langgraph-checkpoint>=4.1.0,<5",
  "langgraph-checkpoint-postgres>=3.1.0,<4",
  "langchain-google-genai>=4.1.0,<5",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.setuptools]
# package source lives one level up (repo-root/orchestrator/__init__.py)
package-dir = {"orchestrator" = ".."}
packages = ["orchestrator"]
