# Dev-only infrastructure. The FastAPI service and Next.js dev server stay native
# (for fast hot-reload + IDE integration). Only stateful infra runs in Docker.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dothesis-postgres
    environment:
      POSTGRES_USER: dothesis
      POSTGRES_PASSWORD: dothesis
      POSTGRES_DB: dothesis
    ports:
      - "5499:5432"
    volumes:
      - dothesis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dothesis -d dothesis"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

volumes:
  dothesis_pgdata:
