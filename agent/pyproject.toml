[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dothesis-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # Deep agent runtime (v3 architecture — docs/architecture/2026-06-10).
  "deepagents>=0.6.8,<0.7",
  "langchain-anthropic>=1.4.0,<2",
  # Whitelisted stats ops (run_stats tool).
  "pandas>=2.0",
  "scipy>=1.11",
  "pyreadstat>=1.2",
  # PDF text extraction (agent/pdf_extract.py, moved here from api/app/pdf_extract.py).
  # Declared on the agent distribution because the multimodal text-only-brain PDF path
  # imports it — and that import is lazy behind `except ImportError: return ("", 0)`, so
  # a missing pdfminer.six looks exactly like a legitimately image-only PDF and silently
  # falls back to the expensive vision model instead of failing loudly. Version constraint
  # matches api/pyproject.toml, which still declares it for the shim it ships.
  "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
# Same editable-install pattern as orchestrator/pyproject.toml: the package
# lives at repo-root/agent/, mapped explicitly so `pip install -e agent`
# exposes `import agent.runtime` from the api process.
package-dir = {"agent" = "../agent"}
packages = [
    "agent",
    "agent.tools",
]
