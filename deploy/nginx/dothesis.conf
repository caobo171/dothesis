# DoThesis nginx vhosts — two hostnames, one Next.js deployment.
#
#   dothesis.com       marketing: the landing page at `/` and the blog at /blog.
#                      Public, indexed, no login anywhere on it.
#   app.dothesis.com   the product: chat, papers, credit, admin, the API and MCP.
#                      Auth-gated, and robots.txt disallows all of it.
#
# Both names proxy to the SAME Next.js process on 3006. Which site a request
# belongs to is decided in web/proxy.js from the Host header, so there is one
# build and one systemd service to keep in sync rather than two.
#
# Install:
#   1. DNS: A record for dothesis.com and for app.dothesis.com, both at this server.
#      (A CNAME for www.dothesis.com -> dothesis.com if you want the www alias.)
#   2. sudo cp deploy/nginx/dothesis.conf /etc/nginx/conf.d/dothesis.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d dothesis.com -d www.dothesis.com -d app.dothesis.com
#      (one run, all three names; certbot adds the 443 listeners and the redirect)
#
# The web app must be built with these set, because NEXT_PUBLIC_* is baked in
# at `next build` time (scripts/deploy.sh step 3):
#   NEXT_PUBLIC_MARKETING_HOST=dothesis.com
#   NEXT_PUBLIC_APP_HOST=app.dothesis.com
#   NEXT_PUBLIC_APP_ORIGIN=https://app.dothesis.com
#   NEXT_PUBLIC_SITE_ORIGIN=https://dothesis.com
#   NEXT_PUBLIC_API_BASE=https://app.dothesis.com/api/v1
#   SERVER_API_BASE=http://127.0.0.1:7100/api/v1
# and the API's own env needs WEB_ORIGIN=https://app.dothesis.com so the links
# in verification and password-reset mail land in the product, not on the
# marketing page.

# ---------------------------------------------------------------- marketing
server {
    listen 80;
    listen [::]:80;
    server_name dothesis.com www.dothesis.com;

    client_max_body_size 10M;

    # The blog renders server-side and the marketing pages are static, so the
    # only upstream here is Next. No /api/v1/ block on purpose: nothing on this
    # host should be calling the API from the browser, and the server-side
    # renderer reaches it over loopback via SERVER_API_BASE.
    location / {
        proxy_pass         http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}

# --------------------------------------------------------------------- app
server {
    listen 80;
    listen [::]:80;
    server_name app.dothesis.com;

    # Thesis data uploads (CSV/XLSX for M4) can be large.
    client_max_body_size 100M;

    # --- API: SSE/streaming chat + runs. Must NOT be buffered. ---
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The chat + auto-run endpoints stream text/event-stream. Buffering here
        # makes tokens arrive in batches (or stall) — turn it off and give long
        # generations room before nginx times out the upstream.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Compress JSON replies. The global http{} block has `gzip on` but
        # leaves gzip_types at its default (text/html only) and gzip_proxied at
        # its default (off — nothing proxied gets compressed), so API responses
        # were going out raw: a 46-project /projects/list was ~3.8 MB on the
        # wire and took ~20s on a mobile downlink while the server built it in
        # 0.2s. JSON is ~10x compressible, and project reads legitimately carry
        # whole context_store slices.
        gzip           on;
        gzip_proxied   any;
        gzip_types     application/json;
        gzip_min_length 1024;
    }

    # --- MCP server (Claude / ChatGPT connectors) and its OAuth façade ---
    location /mcp {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    location /oauth/ {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth discovery. Clients fetch these at the ROOT of the origin, not under
    # /mcp, so they cannot be folded into the block above.
    location /.well-known/oauth-authorization-server {
        proxy_pass         http://127.0.0.1:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass         http://127.0.0.1:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- everything else: the Next.js app ---
    location / {
        proxy_pass         http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
