# DoThesis nginx vhost — modeled on /etc/nginx/conf.d/app.survify.net.conf
#
# Install:
#   1. Replace YOUR_DOMAIN below with the real hostname.
#   2. sudo cp deploy/nginx/dothesis.conf /etc/nginx/conf.d/YOUR_DOMAIN.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d YOUR_DOMAIN     # adds the 443 listener + cert,
#                                              # same way your other vhosts were set up
#
# Routes (matches the systemd services from scripts/deploy.sh):
#   /api/v1/  -> 127.0.0.1:7100  (FastAPI — streamed DIRECTLY, no buffering)
#   /         -> 127.0.0.1:3006  (Next.js web)

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Thesis data uploads (CSV/XLSX for M4) can be large.
    client_max_body_size 100M;

    # --- API: SSE/streaming chat + runs. Must NOT be buffered. ---
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The chat + auto-run endpoints stream text/event-stream. Buffering here
        # makes tokens arrive in batches (or stall) — turn it off and give long
        # generations room before nginx times out the upstream.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- Web: Next.js (HMR/websockets upgrade headers harmless in prod) ---
    location / {
        proxy_pass         http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
