# DoThesis nginx vhost — modeled on /etc/nginx/conf.d/app.survify.net.conf
#
# Install:
#   1. Replace YOUR_DOMAIN below with the real hostname.
#   2. sudo cp deploy/nginx/dothesis.conf /etc/nginx/conf.d/YOUR_DOMAIN.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d YOUR_DOMAIN     # adds the 443 listener + cert,
#                                              # same way your other vhosts were set up
#
# Routes (matches the systemd services from scripts/deploy.sh):
#   /api/v1/  -> 127.0.0.1:7100  (FastAPI — streamed DIRECTLY, no buffering)
#   /mcp                 -> 127.0.0.1:9000  (MCP server, for Claude/ChatGPT connectors)
#   /oauth/              -> 127.0.0.1:9000  (OAuth 2.1 façade for that server)
#   /.well-known/oauth-* -> 127.0.0.1:9000  (OAuth discovery — see the note below)
#   /         -> 127.0.0.1:3006  (Next.js web)

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Thesis data uploads (CSV/XLSX for M4) can be large.
    client_max_body_size 100M;

    # --- API: SSE/streaming chat + runs. Must NOT be buffered. ---
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The chat + auto-run endpoints stream text/event-stream. Buffering here
        # makes tokens arrive in batches (or stall) — turn it off and give long
        # generations room before nginx times out the upstream.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Compress JSON replies. The global http{} block has `gzip on` but
        # leaves gzip_types at its default (text/html only) and gzip_proxied at
        # its default (off — nothing proxied gets compressed), so API responses
        # were going out raw: a 46-project /projects/list was ~3.8 MB on the
        # wire and took ~20s on a mobile downlink while the server built it in
        # 0.2s. JSON is ~10x compressible, and project reads legitimately carry
        # whole context_store slices.
        #
        # gzip_types deliberately does NOT include text/event-stream: gzipping
        # SSE would make nginx hold tokens back to fill a compression buffer,
        # undoing the `proxy_buffering off` above. Streaming stays uncompressed.
        gzip             on;
        gzip_proxied     any;
        gzip_types       application/json;
        gzip_min_length  1024;
        gzip_comp_level  5;
        gzip_vary        on;
    }

    # --- MCP: the connector endpoint + its authorization server ---
    #
    # These MUST be matched before the `/` catch-all, or Next.js answers them
    # with its 404 page and Claude reports "Couldn't register with dothesis's
    # sign-in service" — the dynamic-client-registration step failing on HTML.
    # `^~` makes nginx stop at the prefix and skip regex locations entirely, so
    # a future regex block can't steal them back.
    #
    # The discovery documents sit at the ORIGIN ROOT rather than under /mcp
    # because that is where clients look for them (RFC 9728 / RFC 8414). That is
    # the one real cost of sharing an origin with the web app, and it is paid
    # here, in proxy config, rather than in application code. The prefix is
    # `/.well-known/oauth-` specifically so certbot's
    # `/.well-known/acme-challenge/` is untouched.
    # One regex block rather than four prefix blocks: a regex location outranks
    # the `/` prefix catch-all, and keeping the proxy directives in a single
    # place means the four paths cannot drift apart. `/api/v1/` is unaffected —
    # it doesn't match this pattern.
    location ~ ^/(mcp$|mcp/|oauth/|\.well-known/oauth-) {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        # Host + X-Forwarded-Proto are load-bearing here, not boilerplate: the
        # façade derives its own issuer/endpoint URLs from them (mcp/oauth.py
        # _base_url). Drop them and it advertises http://127.0.0.1:9000 as the
        # authorization server, which no client can reach.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A humanize tool call is a 20-30s model round-trip.
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Web: Next.js (HMR/websockets upgrade headers harmless in prod) ---
    location / {
        proxy_pass         http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
